<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection check</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Connection <span class="highlight">check</span></h1>
                <span class="status-badge" id="status" aria-live="polite">Private by default</span>
            </div>
        </header>

        <section class="ua-section" aria-labelledby="intro-title">
            <div class="section-header">
                <h2 id="intro-title">See your connection address</h2>
            </div>
            <p class="intro-copy">Your address is only requested after you choose to reveal it. This page does not collect location, device details, or send your information elsewhere.</p>
            <button class="primary-button" id="revealButton" type="button">Show my address</button>
            <p class="help-text" id="helpText">Nothing has been requested yet.</p>
        </section>

        <section class="info-grid" id="result" hidden aria-live="polite" aria-labelledby="result-title">
            <article class="info-card ip-card">
                <div class="card-content">
                    <span class="card-label" id="result-title">Your connection address</span>
                    <strong class="card-value" id="ipAddress"></strong>
                </div>
            </article>
        </section>
    </main>

    <script>
        const button = document.getElementById('revealButton');
        const status = document.getElementById('status');
        const helpText = document.getElementById('helpText');
        const result = document.getElementById('result');
        const ipAddress = document.getElementById('ipAddress');

        button.addEventListener('click', async () => {
            button.disabled = true;
            button.textContent = 'Checking…';
            helpText.textContent = 'Requesting your address…';

            try {
                const response = await fetch('/api/connection');
                if (!response.ok) throw new Error('Request failed');

                const data = await response.json();
                ipAddress.textContent = data.ip || 'Unavailable';
                result.hidden = false;
                status.textContent = 'Address revealed';
                status.classList.add('success');
                helpText.textContent = 'Your address is shown only in this browser session.';
                button.textContent = 'Address shown';
            } catch {
                status.textContent = 'Could not check address';
                status.classList.add('error');
                helpText.textContent = 'Please try again in a moment.';
                button.textContent = 'Try again';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
